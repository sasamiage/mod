name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build autocombat
        run: |
          mkdir -p work/autocombat out
          unzip -o autocombat-project.zip -d work/autocombat
          cd work/autocombat
          gradle build --no-daemon
          cp build/libs/*.jar ../../out/

      # 保険：Actionsの画面からも取れる（zipで落ちてくる）
      - uses: actions/upload-artifact@v4
        with:
          name: autocombat-jar
          path: out/*.jar

      # jarそのものをReleasesに置く（スマホでそのままダウンロードできる）
      - name: Publish jar to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autocombat-latest
          name: AutoCombat (latest build)
          files: out/*.jar
